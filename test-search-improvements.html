<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Search Improvements</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .test-result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Test Search API Improvements</h1>
    
    <div class="test-section">
        <h2>1. Test Pagination (pas=30)</h2>
        <button onclick="testPagination()">Test 30 Results + Pagination</button>
        <div id="limitResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test Name Search (nom + nick)</h2>
        <input type="text" id="nameInput" placeholder="Enter name to search" value="Anna">
        <button onclick="testNameSearch()">Test Name Search</button>
        <div id="nameResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test Location Search</h2>
        <input type="text" id="locationInput" placeholder="Enter location" value="Paris">
        <button onclick="testLocationSearch()">Test Location Search</button>
        <div id="locationResult" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Test Profile Complete</h2>
        <button onclick="testProfileComplete()">Test Full Profile Data</button>
        <div id="profileResult" class="test-result"></div>
    </div>

    <script>
        // Получаем API ключ из localStorage или используем тестовый
        const API_KEY = localStorage.getItem('spice_api_key') || 'test_key';
        const BASE_URL = 'https://dev2018.de5a7.com';
        
        async function makeSearchRequest(params) {
            const queryString = new URLSearchParams({
                api_key: API_KEY,
                force_pays: 64,
                ...params
            }).toString();
            
            const url = `${BASE_URL}/index_api/search?${queryString}`;
            console.log('Making request to:', url);
            
            try {
                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Request failed:', error);
                return { error: error.message };
            }
        }
        
        async function testPagination() {
            const resultDiv = document.getElementById('limitResult');
            resultDiv.innerHTML = '🔄 Testing pagination (30 per page)...';
            
            const result = await makeSearchRequest({
                pas: 30,
                is_photo: 1,
                page: 0
            });
            
            if (result.error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${result.error}</div>`;
                return;
            }
            
            const count = result.result ? result.result.length : 0;
            const total = result.total || 0;
            const totalPages = result.nb_pages || Math.ceil(total / 30) || 1;
            
            let message = `
                <div class="success">
                    ✅ Pagination Test Results:<br>
                    • Results on page 1: ${count}<br>
                    • Total available: ${total}<br>
                    • Total pages: ${totalPages}<br>
                    • Expected per page: 30
                </div>
            `;
            
            if (totalPages > 1) {
                message += `<br><button onclick="testPage2()" style="margin-top: 10px;">Test Page 2</button>`;
            }
            
            resultDiv.innerHTML = message;
            console.log('Pagination test result:', result);
        }
        
        async function testPage2() {
            const resultDiv = document.getElementById('limitResult');
            const currentContent = resultDiv.innerHTML;
            
            const result = await makeSearchRequest({
                pas: 30,
                is_photo: 1,
                page: 1 // Page 2 (0-based)
            });
            
            if (result.error) {
                resultDiv.innerHTML = currentContent + `<div class="error">❌ Page 2 Error: ${result.error}</div>`;
                return;
            }
            
            const count = result.result ? result.result.length : 0;
            resultDiv.innerHTML = currentContent + `<div class="success">✅ Page 2: Got ${count} results</div>`;
            console.log('Page 2 test result:', result);
        }
        
        async function testNameSearch() {
            const resultDiv = document.getElementById('nameResult');
            const name = document.getElementById('nameInput').value;
            
            if (!name) {
                resultDiv.innerHTML = '<div class="error">Please enter a name</div>';
                return;
            }
            
            resultDiv.innerHTML = `🔄 Searching for "${name}"...`;
            
            const result = await makeSearchRequest({
                nom: name,
                nick: name,
                pas: 20,
                page: 0
            });
            
            if (result.error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${result.error}</div>`;
                return;
            }
            
            const count = result.result ? result.result.length : 0;
            const matches = result.result ? result.result.filter(user => 
                (user.pseudo && user.pseudo.toLowerCase().includes(name.toLowerCase())) ||
                (user.nom && user.nom.toLowerCase().includes(name.toLowerCase()))
            ).length : 0;
            
            resultDiv.innerHTML = `<div class="success">✅ Found ${count} results, ${matches} name matches for "${name}"</div>`;
            console.log('Name search result:', result);
        }
        
        async function testLocationSearch() {
            const resultDiv = document.getElementById('locationResult');
            const location = document.getElementById('locationInput').value;
            
            if (!location) {
                resultDiv.innerHTML = '<div class="error">Please enter a location</div>';
                return;
            }
            
            resultDiv.innerHTML = `🔄 Searching for location "${location}"...`;
            
            const result = await makeSearchRequest({
                nom: location,
                pas: 20,
                page: 0
            });
            
            if (result.error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${result.error}</div>`;
                return;
            }
            
            const count = result.result ? result.result.length : 0;
            resultDiv.innerHTML = `<div class="success">✅ Location search returned ${count} results for "${location}"</div>`;
            console.log('Location search result:', result);
        }
        
        async function testProfileComplete() {
            const resultDiv = document.getElementById('profileResult');
            resultDiv.innerHTML = '🔄 Testing profile_complete parameter...';
            
            const result = await makeSearchRequest({
                profile_complete: 1,
                get_picture_430: 1,
                pas: 10,
                page: 0
            });
            
            if (result.error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${result.error}</div>`;
                return;
            }
            
            const count = result.result ? result.result.length : 0;
            const withDescription = result.result ? result.result.filter(user => user.description).length : 0;
            const withPhotosV2 = result.result ? result.result.filter(user => user.photos_v2).length : 0;
            
            resultDiv.innerHTML = `
                <div class="success">
                    ✅ Profile Complete Test:<br>
                    • Total results: ${count}<br>
                    • With descriptions: ${withDescription}<br>
                    • With photos_v2: ${withPhotosV2}<br>
                    • Sample user data: ${JSON.stringify(result.result?.[0] || {}, null, 2).substring(0, 200)}...
                </div>
            `;
            console.log('Profile complete result:', result);
        }
        
        // Auto-run basic test on page load
        window.addEventListener('load', () => {
            // Security: API key logging removed for production
            // console.log('🚀 Search improvements test page loaded');
            // console.log('API Key:', API_KEY);
        });
    </script>
</body>
</html>
