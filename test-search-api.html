<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест API поиска - Lavrilo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .result-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .photo-info {
            background: #e9ecef;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .photo-preview {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .photo-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            color: #155724;
            background: #d4edda;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Тест API поиска</h1>
    
    <div class="test-container">
        <h2>Параметры поиска</h2>
        <div>
            <label>
                <input type="checkbox" id="withPhotos" checked> Только с фотографиями
            </label>
        </div>
        <div>
            <label>
                <input type="checkbox" id="getPicture430" checked> Получить photos_v2 (430px)
            </label>
        </div>
        <div>
            <label>
                Поиск по нику: <input type="text" id="searchNick" placeholder="Введите ник...">
            </label>
        </div>
        <button onclick="testSearch()">🚀 Тестировать поиск</button>
    </div>

    <div id="results"></div>

    <script src="js/auth-manager.js"></script>
    <script>
        async function testSearch() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="success">⏳ Выполняется поиск...</div>';

            try {
                // Проверяем авторизацию
                if (!window.authManager || !window.authManager.isLoggedIn) {
                    resultsDiv.innerHTML = '<div class="error">❌ Пользователь не авторизован. Перейдите на главную страницу для авторизации.</div>';
                    return;
                }

                // Собираем параметры
                const params = {
                    session_id: window.authManager.sessionId
                };

                if (document.getElementById('withPhotos').checked) {
                    params.is_photo = 1;
                }

                if (document.getElementById('getPicture430').checked) {
                    params.get_picture_430 = 1;
                }

                const searchNick = document.getElementById('searchNick').value.trim();
                if (searchNick) {
                    params.nick = searchNick;
                }

                console.log('🔍 Параметры поиска:', params);

                // Выполняем запрос
                const queryString = new URLSearchParams(params).toString();
                const response = await fetch(`/api/spice-multi-test?endpoint=/index_api/search&method=POST&${queryString}`);
                const result = await response.json();

                console.log('📊 Результат поиска:', result);

                // Отображаем результат
                if (result.success && result.data) {
                    displayResults(result.data);
                } else {
                    resultsDiv.innerHTML = `<div class="error">❌ Ошибка поиска: ${JSON.stringify(result)}</div>`;
                }

            } catch (error) {
                console.error('Ошибка:', error);
                resultsDiv.innerHTML = `<div class="error">❌ Ошибка: ${error.message}</div>`;
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (!data.result || data.result.length === 0) {
                resultsDiv.innerHTML = '<div class="error">❌ Пользователи не найдены</div>';
                return;
            }

            let html = `<div class="success">✅ Найдено пользователей: ${data.total || data.result.length}</div>`;
            
            data.result.forEach((user, index) => {
                html += `
                    <div class="result-item">
                        <h3>👤 ${user.pseudo || 'Без ника'} (ID: ${user.id})</h3>
                        <p><strong>Возраст:</strong> ${user.age || 'не указан'}</p>
                        <p><strong>Количество фото:</strong> ${user.photo || 0}</p>
                        <p><strong>Онлайн:</strong> ${user.online ? 'Да' : 'Нет'}</p>
                        
                        <div class="photo-info">
                            <strong>📷 Информация о фотографиях:</strong><br>
                            <strong>photos_v2:</strong> ${user.photos_v2 ? `${user.photos_v2.length} фото` : 'нет'}<br>
                            <strong>photos:</strong> ${user.photos ? `${user.photos.length} фото` : 'нет'}
                        </div>
                        
                        ${displayPhotos(user)}
                        
                        <details>
                            <summary>🔍 Полные данные пользователя</summary>
                            <pre>${JSON.stringify(user, null, 2)}</pre>
                        </details>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        function displayPhotos(user) {
            let html = '<div class="photo-preview">';
            let hasPhotos = false;

            // Показываем photos_v2
            if (user.photos_v2 && user.photos_v2.length > 0) {
                hasPhotos = true;
                html += '<div><strong>photos_v2:</strong><br>';
                user.photos_v2.slice(0, 3).forEach(photo => {
                    const url = photo.sq_middle || photo.sq_430 || photo.normal || photo.sq_small;
                    if (url) {
                        html += `<img src="${url}" alt="Photo" title="URL: ${url}">`;
                    }
                });
                html += '</div>';
            }

            // Показываем photos
            if (user.photos && user.photos.length > 0) {
                hasPhotos = true;
                html += '<div><strong>photos:</strong><br>';
                user.photos.slice(0, 3).forEach(photo => {
                    const url = photo.url_middle || photo.url_big || photo.url_small;
                    if (url) {
                        html += `<img src="${url}" alt="Photo" title="URL: ${url}">`;
                    }
                });
                html += '</div>';
            }

            html += '</div>';

            if (!hasPhotos) {
                html = '<div class="photo-info">📷 Фотографии не найдены</div>';
            }

            return html;
        }

        // Автоматически запускаем тест при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            // Ждем инициализации authManager
            setTimeout(() => {
                if (window.authManager && window.authManager.isLoggedIn) {
                    testSearch();
                }
            }, 1000);
        });
    </script>
</body>
</html>
