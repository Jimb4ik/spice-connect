<!DOCTYPE html>
<html lang="en" class="h-full bg-brand-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse - Lumina</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon/favicon-lumina-v2.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#6366f1', // Indigo 500
                            secondary: '#8b5cf6', // Violet 500
                            accent: '#f43f5e', // Rose 500
                            dark: '#0f172a', // Slate 900
                            surface: '#1e293b', // Slate 800
                            surface2: '#334155', // Slate 700
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-brand-dark text-slate-100 overflow-hidden flex">

    <!-- Sidebar (Desktop) -->
    <aside class="hidden md:flex flex-col w-64 bg-brand-surface border-r border-white/5 h-full flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <img src="images/logo-lumina-v2.png" alt="Lumina" class="h-8 w-auto">
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-secondary to-brand-accent">Lumina</span>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto no-scrollbar">
            <a href="main.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-brand-primary transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="font-medium">Dashboard</span>
            </a>
            
            <a href="explore.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-brand-accent transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span class="font-medium">Explore</span>
            </a>
            
            <a href="browse.html" class="flex items-center gap-3 px-4 py-3 bg-brand-primary/10 text-blue-400 rounded-xl group transition-all">
                <svg class="w-5 h-5 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="font-medium">Browse</span>
            </a>
            
            <a href="connections.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-red-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
                <span class="font-medium">Connections</span>
            </a>
            
            <a href="inbox.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-brand-secondary transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
                <span class="font-medium">Inbox</span>
            </a>

            <div class="border-t border-white/5 my-2"></div>

            <a href="guests.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-emerald-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <span class="font-medium">Guests</span>
            </a>

            <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-pink-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                <span class="font-medium">Inventory</span>
            </a>

            <a href="credits.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-yellow-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="font-medium">Credits</span>
            </a>

            <a href="preferences.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-slate-200 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="font-medium">Preferences</span>
            </a>
            
             <a href="identity.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-brand-primary transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="font-medium">My Identity</span>
            </a>
        </nav>

        <div class="p-4 border-t border-white/5">
            <div class="relative group">
                <button class="flex items-center gap-3 w-full p-2 rounded-xl hover:bg-white/5 transition-colors text-left">
                    <div class="relative">
                        <div id="userAvatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-secondary to-brand-primary flex items-center justify-center text-white font-bold overflow-hidden border border-white/10">
                            <img id="userAvatarImg" class="w-full h-full object-cover hidden">
                            <span id="userAvatarText" class="text-lg">U</span>
                        </div>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-brand-surface rounded-full"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-white truncate" id="dropdownUsername">User</p>
                        <p class="text-xs text-slate-400 truncate">Online</p>
                        </div>
                    </button>
                
                <div class="absolute bottom-full left-0 w-full mb-2 bg-brand-surface2 border border-white/10 rounded-xl shadow-xl overflow-hidden hidden group-hover:block transition-all z-20">
                    <a href="identity.html" class="block px-4 py-3 text-sm text-slate-300 hover:text-white hover:bg-white/5 transition-colors">My Identity</a>
                    <a href="preferences.html" class="block px-4 py-3 text-sm text-slate-300 hover:text-white hover:bg-white/5 transition-colors">Preferences</a>
                    <div class="border-t border-white/10 my-1"></div>
                    <button id="logoutBtn" class="block w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-white/5 transition-colors">Sign Out</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-brand-dark">
        <!-- Mobile Header -->
        <header class="md:hidden h-16 bg-brand-surface border-b border-white/5 flex items-center justify-between px-4 z-20 flex-shrink-0">
            <button id="mobileMenuBtn" class="text-slate-300 hover:text-white">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <span class="text-lg font-bold text-white">Browse</span>
            <div class="w-8"></div>
    </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto space-y-6">
                
                <!-- Filters Section -->
                <div class="bg-brand-surface rounded-2xl border border-white/5 p-6 shadow-xl">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <!-- Search Name -->
                        <div class="space-y-2">
                            <label class="text-xs text-slate-400 font-medium uppercase">Username</label>
                            <input type="text" id="searchName" placeholder="Search by name..." class="w-full bg-slate-800 border-none rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-brand-primary">
        </div>

                        <!-- Gender -->
                        <div class="space-y-2">
                            <label class="text-xs text-slate-400 font-medium uppercase">Gender</label>
                            <select id="searchGender" class="w-full bg-slate-800 border-none rounded-xl text-white focus:ring-2 focus:ring-brand-primary">
                                <option value="">Any</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="couple">Couple</option>
                            </select>
                        </div>
                        
                        <!-- Age Range -->
                        <div class="space-y-2">
                            <label class="text-xs text-slate-400 font-medium uppercase">Age Range</label>
                            <div class="flex items-center gap-2">
                                <input type="number" id="ageMin" placeholder="18" min="18" max="99" class="w-full bg-slate-800 border-none rounded-xl text-white text-center focus:ring-2 focus:ring-brand-primary">
                                <span class="text-slate-500">-</span>
                                <input type="number" id="ageMax" placeholder="80" min="18" max="99" class="w-full bg-slate-800 border-none rounded-xl text-white text-center focus:ring-2 focus:ring-brand-primary">
                    </div>
                </div>
                
                        <!-- Buttons -->
                        <div class="flex items-end gap-2">
                            <button id="searchBtn" class="flex-1 bg-brand-primary hover:bg-brand-secondary text-white font-bold py-2.5 px-4 rounded-xl transition-colors shadow-lg shadow-brand-primary/20">
                                Search
                            </button>
                            <button id="clearFilters" class="bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-xl transition-colors">
                                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Advanced Options -->
                    <div class="mt-4 flex flex-wrap gap-4 border-t border-white/5 pt-4">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" id="onlineOnly" class="form-checkbox rounded bg-slate-800 border-slate-600 text-brand-primary focus:ring-0">
                            <span class="text-sm text-slate-400 group-hover:text-white transition-colors">Online Now</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" id="withPhotos" class="form-checkbox rounded bg-slate-800 border-slate-600 text-brand-primary focus:ring-0" checked disabled>
                            <span class="text-sm text-slate-400 group-hover:text-white transition-colors">With Photos</span>
                        </label>
                    </div>
                </div>
                
                <!-- Results Info -->
                <div class="flex justify-between items-center px-2">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        Results
                        <span id="resultsCount" class="text-sm font-medium text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md">0 found</span>
                    </h2>
                </div>

                <!-- Grid -->
                <div id="searchResults" class="min-h-[400px]">
                    <div id="searchGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                        <!-- Results injected here -->
            </div>

                    <!-- No Results State -->
                    <div id="noResults" class="hidden flex flex-col items-center justify-center py-20">
                        <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center text-4xl mb-4 grayscale opacity-50">
                            🔍
                        </div>
                        <h3 class="text-lg font-medium text-white mb-1">No profiles found</h3>
                        <p class="text-slate-500">Try adjusting your filters</p>
                    </div>
                </div>
                
                <!-- Pagination -->
                <div id="searchPagination" class="flex justify-center gap-2 py-8">
                    <!-- Pagination injected here -->
                </div>
                
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/auth-manager.js"></script>
    <script src="js/header-avatar.js"></script>
    <script src="js/search-page.js"></script>
    
    <script>
        // Custom styling for search cards created by search-page.js
        const style = document.createElement('style');
        style.textContent = `
            .user-card {
                background: #1e293b;
                border-radius: 1rem;
                overflow: hidden;
                position: relative;
                aspect-ratio: 3/4;
                cursor: pointer;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                border: 1px solid rgba(255,255,255,0.05);
            }
            .user-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
                border-color: rgba(124, 58, 237, 0.3);
            }
            .user-photo-container {
                width: 100%;
                height: 100%;
                position: relative;
            }
            .user-avatar-simple {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .user-avatar-placeholder {
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 3rem;
                color: #475569;
                font-weight: bold;
            }
            .user-info {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 1rem;
                background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);
            }
            .user-nickname {
                font-weight: 700;
                color: white;
                font-size: 1.1rem;
                text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            }
            
            /* Pagination Styles */
            .pagination-controls {
                display: flex;
                gap: 0.5rem;
            }
            .pagination-btn {
                padding: 0.5rem 1rem;
                border-radius: 0.75rem;
                background: #1e293b;
                color: #94a3b8;
                font-weight: 500;
                transition: all 0.2s;
            }
            .pagination-btn:hover {
                background: #334155;
                color: white;
            }
            .pagination-btn.active {
                background: #7c3aed;
                color: white;
            }
            .pagination-info {
                display: none; /* Hide info text, keep minimal */
            }
        `;
        document.head.appendChild(style);
        
        // Mobile menu stub
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                // Toggle mobile menu logic here
            });
        }
    </script>
</body>
</html>
