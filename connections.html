<!DOCTYPE html>
<html lang="en" class="h-full bg-brand-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections - Lumina</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon/favicon-lumina.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#7c3aed', // Violet 600
                            secondary: '#8b5cf6', // Violet 500
                            accent: '#f59e0b', // Amber 500
                            dark: '#0f172a', // Slate 900
                            surface: '#1e293b', // Slate 800
                            surface2: '#334155', // Slate 700
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-brand-dark text-slate-100 overflow-hidden flex">

    <!-- Sidebar (Desktop) -->
    <aside class="hidden md:flex flex-col w-64 bg-brand-surface border-r border-white/5 h-full flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <img src="images/logo-lumina.png" alt="Lumina" class="h-8 w-auto">
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-secondary to-brand-accent">Lumina</span>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1">
            <a href="main.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-brand-primary transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="font-medium">Dashboard</span>
            </a>
            
            <a href="explore.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-brand-accent transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span class="font-medium">Explore</span>
            </a>
            
            <a href="connections.html" class="flex items-center gap-3 px-4 py-3 text-white bg-brand-primary/10 rounded-xl group border-l-4 border-red-400 transition-all">
                <svg class="w-5 h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
                <span class="font-medium">Connections</span>
            </a>
            
            <a href="inbox.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all justify-between">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 group-hover:text-brand-secondary transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                    <span class="font-medium">Inbox</span>
                </div>
            </a>
            
            <a href="browse.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-white/5 rounded-xl group transition-all">
                <svg class="w-5 h-5 group-hover:text-blue-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="font-medium">Browse</span>
            </a>
        </nav>

        <div class="p-4 border-t border-white/5">
            <div class="relative group">
                <button class="flex items-center gap-3 w-full p-2 rounded-xl hover:bg-white/5 transition-colors text-left">
                    <div class="relative">
                        <div id="userAvatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-secondary to-brand-primary flex items-center justify-center text-white font-bold overflow-hidden border border-white/10">
                            <img id="userAvatarImg" class="w-full h-full object-cover hidden">
                            <span id="userAvatarText" class="text-lg">U</span>
                        </div>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-brand-surface rounded-full"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-white truncate" id="dropdownUsername">User</p>
                        <p class="text-xs text-slate-400 truncate">Online</p>
                    </div>
                </button>
                
                <div class="absolute bottom-full left-0 w-full mb-2 bg-brand-surface2 border border-white/10 rounded-xl shadow-xl overflow-hidden hidden group-hover:block transition-all z-20">
                    <a href="identity.html" class="block px-4 py-3 text-sm text-slate-300 hover:text-white hover:bg-white/5 transition-colors">My Identity</a>
                    <a href="preferences.html" class="block px-4 py-3 text-sm text-slate-300 hover:text-white hover:bg-white/5 transition-colors">Preferences</a>
                    <a href="credits.html" class="block px-4 py-3 text-sm text-slate-300 hover:text-white hover:bg-white/5 transition-colors">Credits</a>
                    <div class="border-t border-white/10 my-1"></div>
                    <button id="logoutBtn" class="block w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-white/5 transition-colors">Sign Out</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-brand-dark">
        <!-- Mobile Header -->
        <header class="md:hidden h-16 bg-brand-surface border-b border-white/5 flex items-center justify-between px-4 z-20 flex-shrink-0">
            <button id="mobileMenuBtn" class="text-slate-300 hover:text-white">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <span class="text-lg font-bold text-white">Connections</span>
            <div class="w-8"></div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 no-scrollbar">
            <div class="max-w-7xl mx-auto space-y-8">
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-white mb-2">Your Connections</h1>
                        <p class="text-slate-400">People you've matched with. Start a conversation!</p>
                    </div>
                    <a href="explore.html" class="bg-brand-primary hover:bg-brand-secondary text-white px-6 py-3 rounded-xl font-medium shadow-lg shadow-brand-primary/20 transition-all">
                        Find New Matches
                    </a>
                </div>

                <!-- Matches Grid -->
                <div id="matchesContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Matches loaded here -->
                </div>
                
                <!-- Loading State -->
                <div id="matchesLoading" class="flex flex-col items-center justify-center py-20">
                    <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-brand-primary border-t-transparent"></div>
                    <p class="mt-4 text-slate-400">Loading your matches...</p>
                </div>

                <!-- Empty State -->
                <div id="noMatches" class="hidden flex flex-col items-center justify-center py-20 bg-brand-surface rounded-3xl border border-white/5">
                    <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center text-4xl mb-4 grayscale opacity-50">
                        💔
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">No matches yet</h3>
                    <p class="text-slate-400 mb-6 max-w-xs text-center">Start exploring to find people you like!</p>
                    <a href="explore.html" class="px-6 py-3 bg-brand-primary text-white rounded-xl hover:bg-brand-secondary transition-colors">Start Swiping</a>
                </div>
                
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/auth-manager.js"></script>
    <script src="js/header-avatar.js"></script>
    <script src="js/match-utils.js"></script>
    
    <script>
        // Custom rendering for matches to match new design
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.authManager || !window.authManager.isLoggedIn) {
                window.location.href = 'index.html';
                return;
            }
            
            await loadMatches();
        });
        
        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            const loading = document.getElementById('matchesLoading');
            const empty = document.getElementById('noMatches');
            
            try {
                // Use MatchUtils to get matches (from API or local DB)
                const matches = await window.MatchUtils.loadUserMatches();
                
                loading.style.display = 'none';
                
                if (!matches || matches.length === 0) {
                    empty.style.display = 'flex';
                    return;
                }
                
                container.innerHTML = matches.map(match => createMatchCard(match)).join('');
                
            } catch (e) {
                console.error("Error loading matches:", e);
                loading.style.display = 'none';
                empty.style.display = 'flex';
            }
        }
        
        function createMatchCard(match) {
            const name = match.matched_user_name || 'User';
            const id = match.matched_user_id;
            let photoUrl = match.matched_user_photo;
            
            // Fix photo URL
            if (photoUrl && !photoUrl.startsWith('http')) {
                photoUrl = 'https://dev2018.de5a7.com/' + photoUrl;
            }
            if (!photoUrl) photoUrl = 'images/placeholder-user.jpg'; // Fallback
            
            const timeAgo = new Date(match.match_date).toLocaleDateString();
            
            return `
                <div class="bg-brand-surface rounded-2xl overflow-hidden border border-white/5 hover:border-brand-primary/50 transition-all group relative">
                    <div class="aspect-square relative overflow-hidden">
                        <img src="${photoUrl}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-brand-dark/90 via-transparent to-transparent opacity-80"></div>
                        <div class="absolute bottom-0 left-0 p-4 w-full">
                            <h3 class="text-white font-bold text-lg truncate">${name}</h3>
                            <p class="text-xs text-slate-400">Matched ${timeAgo}</p>
                        </div>
                    </div>
                    <div class="p-4 flex gap-2">
                        <a href="inbox.html?contact=${id}" class="flex-1 bg-brand-primary text-white text-center py-2 rounded-lg text-sm font-bold hover:bg-brand-secondary transition-colors">
                            Message
                        </a>
                        <a href="member.html?id=${id}" class="bg-slate-700 text-white p-2 rounded-lg hover:bg-slate-600 transition-colors" title="View Profile">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
