<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lumina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#7c3aed',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark flex items-center justify-center min-h-screen text-white">
    <div class="text-center p-8 bg-slate-800 rounded-2xl shadow-xl max-w-sm w-full mx-4 border border-white/10">
        <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-brand-primary border-t-transparent mb-4"></div>
        <h2 class="text-xl font-bold mb-2">Redirecting to Dashboard...</h2>
        <p class="text-slate-400">Please wait while we load your profile.</p>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('lavrilo_session') && localStorage.getItem('lavrilo_user');
            
            if (!isLoggedIn) {
                window.location.href = 'index.html';
                return;
            }
            
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 500);
        });
    </script>
</body>
</html>
